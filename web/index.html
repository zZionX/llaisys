<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nanonona Chat</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="mark">N</div>
          <div>
            <h1>Nanonona Chat</h1>
            <p id="sessionLabel"></p>
          </div>
        </div>
        <button id="newChat" class="secondary-button" type="button">新会话</button>
        <div class="settings">
          <label>
            <span>Temperature</span>
            <input id="temperature" type="range" min="0.1" max="1.5" step="0.1" value="0.6" />
            <output id="temperatureValue">0.6</output>
          </label>
          <label>
            <span>Max tokens</span>
            <input id="maxTokens" type="number" min="1" max="2048" value="512" />
          </label>
        </div>
      </aside>

      <main class="chat">
        <div id="messages" class="messages"></div>
        <form id="chatForm" class="composer">
          <textarea id="messageInput" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
          <button id="sendButton" type="submit" aria-label="发送">
            <span>发送</span>
          </button>
        </form>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
